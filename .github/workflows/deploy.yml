name: Deploy to Vercel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build application
      run: npm run build
      env:
        NODE_OPTIONS: --max-old-space-size=4096
        
    - name: Deploy to Vercel
      uses: vercel/action@v1
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
      id: vercel-deploy
      
    - name: Comment PR with deployment URL
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          try {
            const deploymentUrl = '${{ steps.vercel-deploy.outputs.preview-url }}' || 'Deployment in progress...';
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Deployment Status**
              
              📱 **Preview URL:** ${deploymentUrl}
              
              ✅ **Status:** Build completed successfully
              🔧 **Built with:** Node.js 22, Vite
              📦 **Framework:** React + TypeScript
              🌐 **Network:** X Layer Integration Ready
              
              This preview will be automatically updated when you push new commits to this PR.`
            });
          } catch (error) {
            console.error('Error posting comment:', error);
            // Still post a basic comment even if there's an error
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Deployment Completed**
              
              ✅ Build successful - Check Vercel dashboard for deployment URL`
            });
          }